    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          if (origFetch) {
            try {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                writable: true,
                value: origFetch.bind(window),
              });
            } catch (_) {}

            try {
              var p = Object.getPrototypeOf(window);
              while (p) {
                var desc = Object.getOwnPropertyDescriptor(p, 'fetch');
                if (desc) {
                  if (!desc.set && desc.configurable) {
                    Object.defineProperty(p, 'fetch', {
                      configurable: true,
                      enumerable: desc.enumerable,
                      get: desc.get || function() { return origFetch; },
                      set: function(fn) {
                        try {
                          Object.defineProperty(window, 'fetch', {
                            configurable: true,
                            enumerable: true,
                            writable: true,
                            value: fn,
                          });
                        } catch (_) {
                          origFetch = fn;
                        }
                      },
                    });
                  }
                  break;
                }
                p = Object.getPrototypeOf(p);
              }
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
